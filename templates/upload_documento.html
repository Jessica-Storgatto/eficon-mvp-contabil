{% extends "base.html" %}
{% block conteudo %}
<h2 style="text-align: center; color: #003366; margin-bottom: 30px;">Enviar Documento</h2>

<div style="background: white; padding: 30px; max-width: 500px; margin: 0 auto; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
    <form action="/documentos/upload" method="POST" enctype="multipart/form-data">
        
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Cliente:</label>
            <select name="cliente_id" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                <option value="">Selecione o cliente...</option>
                {% for c in clientes %}
                    <option value="{{ c.id }}">{{ c.nome }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Tipo de Documento:</label>
            <select name="tipo_doc" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                <option value="Nota Fiscal">Nota Fiscal</option>
                <option value="Extrato Bancário">Extrato Bancário</option>
                <option value="Outro">Outro</option>
            </select>
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Arquivo:</label>
            <input type="file" name="arquivo" style="width: 100%; padding: 10px; border: 1px dashed #ccc; border-radius: 4px; background: #f9f9f9;">
        </div>

        <button type="submit" style="width: 100%; padding: 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer;">
            Enviar Documento
        </button>
    </form>
</div>
{% endblock %}
