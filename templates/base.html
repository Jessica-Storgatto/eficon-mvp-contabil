<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>EFICON — Gestão Contábil</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; }

        /* CABEÇALHO COM PROFUNDIDADE E GRADIENTE FORTE */
        header { 
            background: linear-gradient(135deg, #001a33 0%, #003366 50%, #00509e 100%);
            color: white; 
            padding: 20px 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border-bottom: 3px solid #002244;
        }
        header h1 { 
            margin: 0; 
            font-family: 'Montserrat', sans-serif; 
            font-weight: 800; 
            letter-spacing: 1px; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        /* ESTILO DO "OLÁ, GESTORA" E DO BOTÃO SAIR */
        .user-info { display: flex; align-items: center; gap: 25px; }
        .user-info span { 
            font-family: 'Montserrat', sans-serif; 
            font-weight: 700;
            text-decoration: underline;
            text-decoration-color: #ffc107; /* Sublinhado amarelo */
            text-decoration-thickness: 2px;
            text-underline-offset: 5px;
            font-size: 15px;
        }
        
        /* BOTÃO SAIR MODERNO */
        .btn-sair { 
            background-color: rgba(255, 255, 255, 0.1); 
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white; 
            padding: 8px 16px; 
            border-radius: 8px; 
            text-decoration: none; 
            font-family: 'Montserrat', sans-serif;
            font-weight: 700; 
            font-size: 14px;
            display: flex; align-items: center; gap: 8px;
            transition: all 0.2s ease-in-out;
        }
        .btn-sair:hover { 
            background-color: #dc3545; 
            border-color: #dc3545;
            transform: translateY(-2px); 
            box-shadow: 0 4px 8px rgba(220, 53, 69, 0.4);
        }
        .btn-sair svg { width: 18px; height: 18px; fill: currentColor; }
        
        /* NAVEGAÇÃO */
        nav { background: #00509e; padding: 12px 20px; box-shadow: inset 0 3px 5px rgba(0,0,0,0.1); }
        nav a { color: white; margin-right: 20px; text-decoration: none; font-weight: bold; font-size: 15px; }
        nav a:hover { text-decoration: underline; color: #ffc107; }
        
        /* CONTAINER PRINCIPAL */
        .container { padding: 20px; background: white; margin: 20px auto; width: 80%; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
    </style>
</head>
<body>
    <header>
        <h1>EFICON — Gestão Contábil</h1>
        
        <div class="user-info">
            <span>Olá, gestora</span>
            <!-- Ícone de saída em SVG (seta saindo de uma caixa) -->
            <a href="/logout" class="btn-sair">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
                </svg>
                Sair
            </a>
        </div>
    </header>
    
    <nav>
        <a href="/painel">Painel</a>
        <a href="/clientes">Clientes</a>
        <a href="/clientes/importar">Importar Clientes</a>
        <a href="/documentos/upload">Upload de Documentos</a>
        <a href="/documentos/enviados">Documentos Recebidos</a>
        <a href="/obrigacoes/nova">Cadastrar Obrigação</a>
    </nav>

    <div class="container">
        {% block conteudo %}{% endblock %}
    </div>
</body>
</html>
